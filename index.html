<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Game</title>
    <link rel="stylesheet" href="pacman.css">
    <script src="js/audio.js" defer></script>
    <script src="js/block.js" defer></script>
    <script src="js/game.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <div id="game-container">
        <header id="game-header">
            <h1 class="game-title">PAC-MAN</h1>
            <div class="header-controls">
                <button id="pause-toggle" class="control-btn" title="Pause Game (P / Space)">
                    <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="#fdff00">
                        <rect x="5" y="4" width="4" height="16" rx="1"/>
                        <rect x="15" y="4" width="4" height="16" rx="1"/>
                    </svg>
                </button>
                <button id="sound-toggle" class="control-btn" title="Toggle Sound">
                    <img id="sound-icon" src="./img/sound-on.png" alt="Sound Toggle">
                </button>
            </div>
        </header>
        <canvas id="board"></canvas>
    </div>
</body>
</html>
